.summary{display:flex;gap:12px;padding:20px 40px;background:#fff;border-bottom:1px solid #E2E8F0;flex-wrap:wrap}

.stat-card .val{font-size:26px;font-weight:700;color:#1E3A5F}
.stat-card .lbl{font-size:12px;color:#64748B;margin-top:3px}
.stat-card.pass .val{color:#16A34A}
.stat-card.fail .val{color:#DC2626}
.stat-card.rate .val{color:#2563EB}
.page-tabs{display:flex;background:#fff;border-bottom:2px solid #E2E8F0;padding:0 40px;overflow-x:auto}
.page-tab{padding:13px 18px;cursor:pointer;font-size:14px;font-weight:500;color:#64748B;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-2px;transition:all .15s}
.page-tab.active{color:#2563EB;border-bottom-color:#2563EB;font-weight:600}
.page-tab:hover:not(.active){color:#334155}
.content{padding:20px 40px;max-width:1400px}
.page-panel{display:none}
.page-panel.active{display:block}
.sub-tabs{display:flex;gap:2px;margin-bottom:16px;background:#F1F5F9;border-radius:8px;padding:4px;width:fit-content}
.sub-tab{padding:7px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:#64748B;transition:all .15s}
.sub-tab.active{background:#fff;color:#2563EB;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sub-panel{display:none}
.sub-panel.active{display:block}
.section-card{background:#fff;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:8px;overflow:hidden}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;background:#F8FAFC}
.section-head:hover{background:#F1F5F9}
.section-title{font-weight:600;font-size:13px;color:#1E3A5F}
.section-meta{display:flex;align-items:center;gap:6px}
.badge{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:600}
.badge.pass{background:#DCFCE7;color:#166534}
.badge.fail{background:#FEE2E2;color:#991B1B}
.badge.total{background:#EDE9FE;color:#5B21B6}
.chevron{font-size:11px;color:#94A3B8;transition:transform .2s}
.section-body{display:none;padding:0 16px 12px}
.section-card.open .section-body{display:block}
.section-card.open .chevron{transform:rotate(180deg)}
.test-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid #F1F5F9;gap:8px}
.test-row:last-child{border-bottom:none}

.test-name{flex:1;font-size:12px;color:#374151}

.tc-table th{background:#334155;color:#fff;padding:9px 12px;text-align:left;font-size:12px;font-weight:600}

.chart-section{background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:18px;margin-top:20px}
.chart-title{font-weight:600;color:#1E3A5F;margin-bottom:14px;font-size:14px}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chart-label{width:100px;font-size:12px;color:#374151;text-align:right;flex-shrink:0}
.chart-bar-wrap{flex:1;background:#F1F5F9;border-radius:4px;height:24px;overflow:hidden}
.chart-bar{height:100%;background:linear-gradient(90deg,#2563EB,#60A5FA);border-radius:4px;display:flex;align-items:center;padding:0 8px;min-width:50px}
.chart-pct{font-size:11px;color:#fff;font-weight:600}
.chart-count{font-size:12px;color:#64748B;width:65px;flex-shrink:0}

function getPageTests(pageId, includeCommon) {
  var all = [];
  if (includeCommon) {
    for (var c = 0; c < COMMON_TESTS.length; c++) {
      var ct = COMMON_TESTS[c];
      all.push({id:ct.id,name:ct.name,tag:ct.tag,status:ct.status,type:'COMMON',section:'공통 — 헤더 & GNB'});
    }
  }
  var secs = PAGE_SECTIONS[pageId] || [];
  for (var s = 0; s < secs.length; s++) {
    var sec = secs[s];
    for (var t = 0; t < sec.tests.length; t++) {
      var tt = sec.tests[t];
      all.push({id:tt.id,name:tt.name,tag:tt.tag,status:tt.status,type:'고유',section:sec.id+'. '+sec.name});
    }
  }
  return all;
}
function countTests(pageId, includeCommon) {
  var all = getPageTests(pageId, includeCommon);
  var pass=0,fail=0,skip=0;
  for(var i=0;i<all.length;i++){
    if(all[i].status==='PASS')pass++;
    else if(all[i].status==='SKIP')skip++;
    else fail++;
  }
  return{total:all.length,pass:pass,fail:fail,skip:skip};
}

function renderGapReport(pageId){

  // pageId는 figmaSectionsId (예: 'about-figma') 사용

    if(all[i].status==='FAIL' && all[i].name.indexOf('Figma 갭')>=0){
      gaps.push(all[i]);
    }
    if(all[i].status==='SKIP' && all[i].name.indexOf('Figma 갭 G2')>=0){
      gaps.push(all[i]);
    }

  if(gaps.length===0)return '';

  html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">';

  // 갭별 그룹핑
  var groups={};
  for(var g=0;g<gaps.length;g++){
    var match=gaps[g].name.match(/Figma 갭 (G\d+)/);

    groups[key].push(gaps[g]);
  }
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">';
  var labels={
    G1:'본문 텍스트 차이 ("생활 속" 추가됨)',

    G14:'주주사 LifeStyle 카테고리 미반영 (GS리테일/Smilegate)',
    G15:'(취소) Slogan 텍스트 — 라이브 정상 표시 확인 (자동화 한계로 잘못 분류)',
    G16:'(검토) 사각형 가이드 — 이미지로만 표시되었을 가능성, 시각적 확인 필요',
  };

      '</div>';

    // 검증 모드 토글 (Figma 명세 등록된 페이지만)
    if(hasFigma){
      // figmaOnly 페이지는 라이브 spec 없음 → 디자인 모드 디폴트, 라이브 버튼 비활성
      var isFigmaOnly=!!pm.figmaOnly;
      var liveBtnState=isFigmaOnly?' disabled style="opacity:.4;cursor:not-allowed"':'';
      var liveActive=isFigmaOnly?'':' active';
      var designActive=isFigmaOnly?' active':'';
      html+='<div class="mode-toggle" id="mt-'+pm.id+'">'+
        '<span class="mode-toggle-label">검증 모드</span>'+
        '<div class="mode-toggle-group">'+
        '<button class="mode-toggle-btn'+liveActive+'" id="mode-'+pm.id+'-live" onclick="setMode(\''+pm.id+'\',\'live\')"'+liveBtnState+' title="'+(isFigmaOnly?'라이브 spec 미작성':'')+'"><span class="ico">⚡</span>라이브 검증</button>'+
        '<button class="mode-toggle-btn design'+designActive+'" id="mode-'+pm.id+'-design" onclick="setMode(\''+pm.id+'\',\'design\')"><span class="ico">🎨</span>디자인 명세</button>'+
        '<button class="mode-toggle-btn combined" id="mode-'+pm.id+'-combined" onclick="setMode(\''+pm.id+'\',\'combined\')"'+(isFigmaOnly?' disabled style="opacity:.4;cursor:not-allowed"':'')+'><span class="ico">⚏</span>통합 보기</button>'+
        '</div>'+
        '<span class="mode-toggle-info" id="mode-info-'+pm.id+'">'+(isFigmaOnly?'<b>디자인 모드</b>: Figma 디자인 명세 기반 검증 ('+dc.total+' 케이스). 라이브 spec 미작성됨.':'<b>라이브 모드</b>: 실제 운영 중인 사이트 콘텐츠 검증 ('+c.total+' 케이스, '+c.pass+' PASS)')+'</span>'+
        '</div>';
    }

    // 디자인 갭 보고서 (디자인 모드에서만 표시)
    // figmaOnly 페이지는 처음부터 디자인 모드이므로 즉시 표시
    if(hasFigma){
      var gapInitDisplay=pm.figmaOnly?'block':'none';
      html+='<div id="gap-wrap-'+pm.id+'" style="display:'+gapInitDisplay+'">'+renderGapReport(pm.figmaSectionsId)+'</div>';
    }

    // sub tabs
    html+='<div class="sub-tabs">'+
      '<div class="sub-tab active" onclick="showSubTab(\''+pm.id+'\',\'result\')" id="sub-'+pm.id+'-result">테스트 결과</div>'+
      '<div class="sub-tab" onclick="showSubTab(\''+pm.id+'\',\'cases\')" id="sub-'+pm.id+'-cases">테스트 케이스 (<span id="case-count-'+pm.id+'">'+c.total+'</span>)</div>'+
      '</div>';

    // 라이브 결과 / 디자인 결과 / 통합 — figmaOnly면 디자인이 디폴트
    var isFigmaOnlyForContent=hasFigma&&pm.figmaOnly;
    var liveDisplay=isFigmaOnlyForContent?'none':'block';
    var designDisplay=isFigmaOnlyForContent?'block':'none';
    html+='<div class="sub-panel active" id="subp-'+pm.id+'-result">'+
      '<div id="content-'+pm.id+'-live" style="display:'+liveDisplay+'">'+(isFigmaOnlyForContent?'<div style="padding:30px;text-align:center;color:#94A3B8;font-size:13px">라이브 검증 spec이 아직 작성되지 않았습니다.</div>':renderAccordion(pm.id))+'</div>';

    // 디자인 결과 (Figma 명세 페이지만)
    if(hasFigma){
      html+='<div id="content-'+pm.id+'-design" style="display:'+designDisplay+'">'+renderAccordion(pm.figmaSectionsId)+'</div>';
      html+='<div id="content-'+pm.id+'-combined" style="display:none">'+
        '<div style="background:#E0F2FE;border:1px solid #0E7490;border-radius:8px;padding:12px 16px;margin-bottom:12px;font-size:12px;color:#0E7490"><b>⚏ 통합 보기:</b> 라이브 검증 결과('+c.total+' 케이스) + 디자인 명세 검증 결과('+dc.total+' 케이스). 각 출처는 섹션 타이틀로 구분됩니다.</div>'+
        '<h4 style="font-size:13px;color:#1E40AF;margin:18px 0 8px;display:flex;align-items:center;gap:6px"><span style="background:#DBEAFE;color:#1E40AF;padding:2px 8px;border-radius:4px;font-size:11px">⚡ 라이브</span> 라이브 검증 결과</h4>'+
        (isFigmaOnlyForContent?'<div style="color:#94A3B8;font-size:12px;padding:12px">라이브 spec 미작성</div>':renderAccordion(pm.id))+
        '<h4 style="font-size:13px;color:#7C3AED;margin:18px 0 8px;display:flex;align-items:center;gap:6px"><span style="background:#F5F3FF;color:#7C3AED;padding:2px 8px;border-radius:4px;font-size:11px">🎨 디자인</span> 디자인 명세 검증 결과</h4>'+
        renderAccordion(pm.figmaSectionsId)+
        '</div>';
    }

    html+='</div>'+
      '<div class="sub-panel" id="subp-'+pm.id+'-cases">'+renderTable(pm.id)+'</div>'+
      '</div>';
  }
  html+=renderChart();
  document.getElementById('content-area').innerHTML=html;
}

// 검증 모드 전환 함수 (옵션 A)
function setMode(pageId, mode){
  var pm=null;
  for(var i=0;i<PAGES_META.length;i++)if(PAGES_META[i].id===pageId)pm=PAGES_META[i];
  if(!pm||!pm.figmaSpec)return;

  // 토글 버튼 활성화 갱신
  var modes=['live','design','combined'];
  for(var m=0;m<modes.length;m++){
    var btn=document.getElementById('mode-'+pageId+'-'+modes[m]);
    if(btn)btn.classList.toggle('active', modes[m]===mode);
  }

  // 콘텐츠 섹션 전환
  for(var m2=0;m2<modes.length;m2++){
    var ct=document.getElementById('content-'+pageId+'-'+modes[m2]);
    if(ct)ct.style.display=(modes[m2]===mode?'block':'none');
  }

  // 갭 보고서: 디자인 모드에서만 표시
  var gapWrap=document.getElementById('gap-wrap-'+pageId);
  if(gapWrap)gapWrap.style.display=(mode==='design'?'block':'none');

  // 카운트 갱신
  var liveC=countTests(pageId, pm.hasCommon);
  var designC=countTests(pm.figmaSectionsId, pm.hasCommon);
  var modeMeta={
    'live':{total:liveC.total,pass:liveC.pass,fail:liveC.fail,skip:liveC.skip,
            info:'<b>라이브 모드</b>: 실제 운영 중인 사이트 콘텐츠 검증 ('+liveC.total+' 케이스, '+liveC.pass+' PASS)',
            spec:pm.spec},
    'design':{total:designC.total,pass:designC.pass,fail:designC.fail,skip:designC.skip,
              info:'<b>디자인 모드</b>: Figma 디자인 명세 기반 검증 ('+designC.total+' 케이스, '+designC.pass+' PASS / '+designC.fail+' FAIL / '+designC.skip+' SKIP) — 디자인 갭 발견 시 FAIL 표시',
              spec:pm.figmaSpec},
    'combined':{total:liveC.total+designC.total,pass:liveC.pass+designC.pass,fail:liveC.fail+designC.fail,skip:liveC.skip+designC.skip,
                info:'<b>통합 모드</b>: 라이브 + 디자인 검증 합산 ('+(liveC.total+designC.total)+' 케이스)',
                spec:pm.spec+' + '+pm.figmaSpec}
  };
  var u=modeMeta[mode];

  // 모드 정보 텍스트 갱신
  var info=document.getElementById('mode-info-'+pageId);
  if(info)info.innerHTML=u.info;

  // 페이지 메타 바 갱신
  var specEl=document.getElementById('meta-spec-'+pageId);
  if(specEl)specEl.textContent=u.spec;
  var passBadge=document.getElementById('badge-pass-'+pageId);
  if(passBadge)passBadge.textContent=u.pass+' PASS';
  var failBadge=document.getElementById('badge-fail-'+pageId);
  if(failBadge){
    failBadge.textContent=u.fail+' FAIL';
    failBadge.style.display=(u.fail>0?'inline-block':'none');
  }
  var skipBadge=document.getElementById('badge-skip-'+pageId);
  if(skipBadge){
    skipBadge.textContent=u.skip+' SKIP';
    skipBadge.style.display=(u.skip>0?'inline-block':'none');
  }
  var caseCount=document.getElementById('case-count-'+pageId);
  if(caseCount)caseCount.textContent=u.total;

  // 상단 stat-card 동기화
  updateSummaryForMode(pageId, mode, modeMeta);
}

function showPage(id){
  var panels=document.querySelectorAll('.page-panel');
  var tabs=document.querySelectorAll('.page-tab');
  for(var i=0;i<panels.length;i++)panels[i].classList.remove('active');
  for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
  document.getElementById('panel-'+id).classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
}
function showSubTab(pageId,which){
  ['result','cases'].forEach(function(w){
    document.getElementById('subp-'+pageId+'-'+w).classList.remove('active');
    document.getElementById('sub-'+pageId+'-'+w).classList.remove('active');
  });
  document.getElementById('subp-'+pageId+'-'+which).classList.add('active');
  document.getElementById('sub-'+pageId+'-'+which).classList.add('active');
}
function toggleSection(id){var el=document.getElementById('acc-'+id);if(el)el.classList.toggle('open');}

function pad2(n){return n<10?'0'+n:''+n;}
function xe(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function exportExcel(){
  var d=new Date();
  var ds=d.getFullYear()+''+pad2(d.getMonth()+1)+''+pad2(d.getDate());
  var xml='<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n'+
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n'+
    '<Styles>\n'+
    '<Style ss:ID="sT"><Font ss:Bold="1" ss:Color="#FFFFFF" ss:Size="12"/><Interior ss:Color="#1E3A5F" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/></Style>\n'+
    '<Style ss:ID="sH"><Font ss:Bold="1" ss:Color="#FFFFFF" ss:Size="10"/><Interior ss:Color="#334155" ss:Pattern="Solid"/></Style>\n'+
    '<Style ss:ID="sS"><Font ss:Bold="1" ss:Size="10"/><Interior ss:Color="#E2E8F0" ss:Pattern="Solid"/></Style>\n'+
    '<Style ss:ID="sD"><Font ss:Size="10"/><Interior ss:Color="#FFFFFF" ss:Pattern="Solid"/></Style>\n'+
    '<Style ss:ID="sA"><Font ss:Size="10"/><Interior ss:Color="#F8FAFC" ss:Pattern="Solid"/></Style>\n'+
    '<Style ss:ID="sP"><Font ss:Bold="1" ss:Color="#166534" ss:Size="10"/><Interior ss:Color="#DCFCE7" ss:Pattern="Solid"/></Style>\n'+
    '<Style ss:ID="sF"><Font ss:Bold="1" ss:Color="#991B1B" ss:Size="10"/><Interior ss:Color="#FEE2E2" ss:Pattern="Solid"/></Style>\n'+
    '</Styles>\n';

  xml+='<Worksheet ss:Name="전체 요약"><Table>\n'+
    '<Row ss:Height="28"><Cell ss:StyleID="sT" ss:MergeAcross="4"><Data ss:Type="String">KBank PC 홈페이지 테스트 결과서 — '+TODAY+'</Data></Cell></Row>\n'+
    '<Row><Cell ss:StyleID="sH"><Data ss:Type="String">페이지</Data></Cell>'+
    '<Cell ss:StyleID="sH"><Data ss:Type="String">전체</Data></Cell>'+
    '<Cell ss:StyleID="sH"><Data ss:Type="String">PASS</Data></Cell>'+
    '<Cell ss:StyleID="sH"><Data ss:Type="String">FAIL</Data></Cell>'+
    '<Cell ss:StyleID="sH"><Data ss:Type="String">통과율</Data></Cell></Row>\n';
  var gt=0,gp=0,gf=0;
  for(var p=0;p<PAGES_META.length;p++){
    var pm=PAGES_META[p];var c=countTests(pm.id,pm.hasCommon);var pct=c.total>0?Math.round(c.pass/c.total*100):0;
    gt+=c.total;gp+=c.pass;gf+=c.fail;
    xml+='<Row><Cell ss:StyleID="sD"><Data ss:Type="String">'+xe(pm.name)+'</Data></Cell>'+
      '<Cell ss:StyleID="sD"><Data ss:Type="Number">'+c.total+'</Data></Cell>'+
      '<Cell ss:StyleID="sP"><Data ss:Type="Number">'+c.pass+'</Data></Cell>'+
      '<Cell ss:StyleID="'+(c.fail>0?'sF':'sD')+'"><Data ss:Type="Number">'+c.fail+'</Data></Cell>'+
      '<Cell ss:StyleID="sD"><Data ss:Type="String">'+pct+'%</Data></Cell></Row>\n';
  }
  var gr=gt>0?Math.round(gp/gt*100):0;
  xml+='<Row><Cell ss:StyleID="sS"><Data ss:Type="String">합계</Data></Cell>'+
    '<Cell ss:StyleID="sS"><Data ss:Type="Number">'+gt+'</Data></Cell>'+
    '<Cell ss:StyleID="sS"><Data ss:Type="Number">'+gp+'</Data></Cell>'+
    '<Cell ss:StyleID="sS"><Data ss:Type="Number">'+gf+'</Data></Cell>'+
    '<Cell ss:StyleID="sS"><Data ss:Type="String">'+gr+'%</Data></Cell></Row>\n'+
    '</Table></Worksheet>\n';

  for(var p=0;p<PAGES_META.length;p++){
    var pm=PAGES_META[p];var all=getPageTests(pm.id,pm.hasCommon);
    xml+='<Worksheet ss:Name="'+xe(pm.name)+'"><Table>\n'+
      '<Row ss:Height="22"><Cell ss:StyleID="sT" ss:MergeAcross="5"><Data ss:Type="String">'+xe(pm.name)+' — '+pm.url+'</Data></Cell></Row>\n'+
      '<Row><Cell ss:StyleID="sH"><Data ss:Type="String">#</Data></Cell>'+
      '<Cell ss:StyleID="sH"><Data ss:Type="String">섹션</Data></Cell>'+
      '<Cell ss:StyleID="sH"><Data ss:Type="String">테스트 항목</Data></Cell>'+
      '<Cell ss:StyleID="sH"><Data ss:Type="String">태그</Data></Cell>'+
      '<Cell ss:StyleID="sH"><Data ss:Type="String">구분</Data></Cell>'+
      '<Cell ss:StyleID="sH"><Data ss:Type="String">상태</Data></Cell></Row>\n';
    var prevSec='',rn=0;
    for(var i=0;i<all.length;i++){
      var t=all[i];
      if(t.section!==prevSec){
        xml+='<Row><Cell ss:StyleID="sS" ss:MergeAcross="5"><Data ss:Type="String">'+xe(t.section)+'</Data></Cell></Row>\n';
        prevSec=t.section;rn=0;
      }
      rn++;
      var ds2=rn%2===0?'sA':'sD';
      var ss2=t.status==='PASS'?'sP':(t.status==='FAIL'?'sF':'sD');
      xml+='<Row><Cell ss:StyleID="'+ds2+'"><Data ss:Type="Number">'+(i+1)+'</Data></Cell>'+
        '<Cell ss:StyleID="'+ds2+'"><Data ss:Type="String">'+xe(t.section)+'</Data></Cell>'+
        '<Cell ss:StyleID="'+ds2+'"><Data ss:Type="String">'+xe(t.name)+'</Data></Cell>'+
        '<Cell ss:StyleID="'+ds2+'"><Data ss:Type="String">'+xe(t.tag)+'</Data></Cell>'+
        '<Cell ss:StyleID="'+ds2+'"><Data ss:Type="String">'+t.type+'</Data></Cell>'+
        '<Cell ss:StyleID="'+ss2+'"><Data ss:Type="String">'+t.status+'</Data></Cell></Row>\n';
    }
    xml+='</Table></Worksheet>\n';
  }
  xml+='</Workbook>';
  var blob=new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kbank-e2e-report-'+ds+'.xls';a.click();
}
